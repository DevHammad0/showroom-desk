<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#171b21" />
  <meta name="description" content="Top Wheels showroom management demo: inventory, purchases, sales, customers, dues and finances." />
  <title>Top Wheels · Showroom Desk</title>
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar" id="sidebar">
      <div class="brand">
        <div class="brand-logo-frame"><img src="assets/top-wheels-logo-transparent.png" alt="Top Wheels" /></div>
      </div>
      <div class="side-label">MAIN MENU</div>
      <nav id="navigation" aria-label="Main navigation"></nav>
      <div class="side-bottom">
        <div class="demo-card"><span class="demo-icon">✦</span><div><strong>Demo workspace</strong><p>Sample records for feedback. Changes stay in this browser.</p></div></div>
        <button class="side-help" data-action="help"><span>?</span> Help & feedback <span class="arrow">↗</span></button>
      </div>
    </aside>
    <div class="main-area">
      <header class="topbar">
        <div class="topbar-left"><button class="icon-button mobile-menu" data-action="menu" aria-label="Open menu">☰</button><div class="breadcrumb">Top Wheels <span>/</span> <strong id="breadcrumb-page">Overview</strong></div></div>
        <div class="topbar-right"><span class="topbar-date" id="topbar-date"></span><span class="topbar-divider"></span><div class="user-avatar">TW</div><div class="user-name"><strong>Showroom owner</strong><small>Demo access</small></div></div>
      </header>
      <main id="app" tabindex="-1"></main>
    </div>
  </div>
  <div id="modal-root"></div>
  <div id="toast-root" aria-live="polite"></div>
  <script src="app.js" defer></script>
</body>
</html>
